# Обратный прокси перед приложением: HTTPS, заголовки безопасности, ограничение частоты запросов.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;
server_tokens off;   # не раскрывать версию nginx

# DNS Docker: при пересоздании контейнера app (выпуск версии) адрес перечитывается без перезапуска nginx
resolver 127.0.0.11 valid=10s ipv6=off;

upstream studio_app {
    zone studio_app 64k;
    server app:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    location = /api/health { proxy_pass http://studio_app; }   # для внешнего мониторинга без TLS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types application/json text/css application/javascript;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;

    # метрики читает только Prometheus из внутренней сети
    location = /api/metrics { return 404; }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://studio_app;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://studio_app;
    }

    location /static/ {
        proxy_pass http://studio_app;
        expires 1h;
    }

    location / {
        proxy_pass http://studio_app;
    }
}
